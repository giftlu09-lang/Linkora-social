version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dev-only default credentials — postgres:16-alpine refuses to start
      # without POSTGRES_PASSWORD. Override via a .env file for anything
      # beyond local development.
      POSTGRES_USER: ${POSTGRES_USER:-linkora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkora}
      POSTGRES_DB: ${POSTGRES_DB:-linkora}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters only — losing them on restart costs at most one
    # window of enforcement, so no persistence is configured.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  indexer:
    build:
      context: ./services/indexer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_ID: ${CONTRACT_ID:-}
      START_LEDGER: ${START_LEDGER:-0}
      PORT: 3000
      # Required for shared rate limiting. Without it each replica keeps its
      # own counters and the effective limit becomes limit x replicaCount.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  dm-relay:
    build:
      context: ./services/dm-relay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}_dm_relay
      PORT: 3001
      STELLAR_NETWORK: ${STELLAR_NETWORK:-Testnet}
      # Required for shared rate limiting (HTTP and WebSocket).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3001:3001"
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  analytics-oracle:
    build:
      context: ./services/analytics-oracle
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkora}:${POSTGRES_PASSWORD:-linkora}@postgres:5432/${POSTGRES_DB:-linkora}
      SOROBAN_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_ID: ${CONTRACT_ID:-}
      # Signing key is read from a mounted secret FILE (hex-encoded 32-byte
      # Ed25519 seed), never from an environment variable. Mount the file:
      #   ORACLE_KEY_FILE=${PWD}/oracle-key.hex
      SECRETS: file://${ORACLE_KEY_FILE:-/run/secrets/oracle-key.hex}
      # Bearer token for the authenticated POST /admin/rotate-key endpoint.
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ORACLE_NAME: ${ORACLE_NAME:-default}
      WINDOW_LEDGERS: ${WINDOW_LEDGERS:-1000}
      PORT: 4000
      # Required for shared rate limiting.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount the oracle signing key file into the container.
      - ${ORACLE_KEY_FILE:-./oracle-key.hex}:/run/secrets/oracle-key.hex:ro
    networks:
      - backend
      - database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification:
    build:
      context: ./services/notification
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3002:3002"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  search:
    build:
      context: ./services/search
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3003:3003"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  media:
    build:
      context: ./services/media
    restart: unless-stopped
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "3004:3004"
    networks:
      - backend
    profiles: [monitoring]
    depends_on:
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
    profiles: [monitoring]
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - backend

networks:
  frontend:
  backend:
  database:

volumes:
  postgres_data:
